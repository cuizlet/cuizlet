<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrimQuiz – BS Criminology Reviewer</title>
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d2330;--mu:#6a7080;--ac:#1f3a68;--ok:#1b7a47;--no:#b42318;--bd:#dcdad2}
@media (prefers-color-scheme:dark){:root{--bg:#12161f;--sf:#1b2130;--tx:#e8eaf0;--mu:#99a0b2;--ac:#7fa6ee;--ok:#4cc38a;--no:#f08a80;--bd:#2c3446;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0;color:var(--ac)}h2{font-size:17px;margin:0 0 10px}nav{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}button{cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}button.on{border-color:var(--ac);font-weight:600}
input,select,textarea{width:100%;margin:4px 0 10px}textarea{min-height:140px;font:13px monospace}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--sf))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--sf))}
.mu{color:var(--mu);font-size:14px}.err{color:var(--no)}.rat{border-left:4px solid var(--ac);padding:6px 12px;margin-top:10px;background:var(--bg);border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
</style></head><body><main id="app"><p class="mu">Loading…</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,addDoc,getDocs,query,where,limit,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== 1. PASTE YOUR FIREBASE WEB-APP CONFIG HERE ======
const firebaseConfig={apiKey:"AIzaSyCO4Ho1cKpKflVo1x9cRB7--k2PRJqJ9Ak",authDomain:"cuizlet.firebaseapp.com",projectId:"cuizlet",appId:"1:73598399314:web:9e2ad4db5c57803f9c008b"};
// ====== 2. YOUR ADMIN GMAIL (lowercase; same as in firestore.rules) ======
const ADMIN_EMAIL="kisukeurahara0313@gmail.com";

const AREAS={
"Criminal Law & Jurisprudence (20%)":[["CLJ 1","Intro to Philippine Criminal Justice System"],["CLJ 2","Human Rights Education"],["CLJ 3","Criminal Law Book 1"],["CLJ 4","Criminal Law Book 2"],["CLJ 5","Evidence"],["CLJ 6","Criminal Procedure"],["CLJ 7","Court Testimony"]],
"Law Enforcement Administration (20%)":[["LEA 1","Law Enforcement Administration (Inter-Agency Approach)"],["LEA 2","Comparative Models in Policing"],["LEA 3","Intro to Industrial Security Concepts"],["LEA 4","Law Enforcement Operation & Planning with Crime Mapping"]],
"Criminalistics / Forensic Science (15%)":[["FORENSIC 1","Forensic Photography"],["FORENSIC 2","Personal Identification Techniques"],["FORENSIC 3","Forensic Chemistry & Toxicology"],["FORENSIC 4","Questioned Documents Examination"],["FORENSIC 5","Lie Detection Techniques"],["FORENSIC 6","Forensic Ballistics"]],
"Crime Detection & Investigation (15%)":[["CDI 1","Fundamentals of Criminal Investigation & Intelligence"],["CDI 2","Special Crime Investigation 1 with Legal Medicine"],["CDI 3","Special Crime Investigation 2 with Simulation on Interview & Interrogation"],["CDI 4","Traffic Management & Accident Investigation with Driving"],["CDI 5","Technical English 1 (Investigative Report Writing)"],["CDI 6","Fire Protection & Arson Investigation"],["CDI 7","Vice & Drug Education and Control"],["CDI 8","Technical English 2 (Legal Forms)"],["CDI 9","Intro to Cybercrime & Environmental Laws and Protection"]],
"Criminal Sociology / Criminology (15%)":[["CRIM 1","Introduction to Criminology"],["CRIM 2","Theories of Crime Causation"],["CRIM 3","Human Behavior & Victimology"],["CRIM 4","Professional Conduct & Ethical Standards"],["CRIM 5","Juvenile Delinquency & Juvenile Justice System"],["CRIM 6","Dispute Resolution & Crisis/Incident Management"],["CRIM 7","Criminological Research 1 and 2"]],
"Correctional Administration (10%)":[["CA 1","Institutional Corrections"],["CA 2","Non-institutional Corrections"],["CA 3","Therapeutic Modalities"]]};
const ALLSUB=Object.fromEntries(Object.values(AREAS).flat());
const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),db=getFirestore(fapp);
const app=document.getElementById("app"),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(a,b)=>b?Math.round(100*a/b):0;
let U,admin=false,tab="quiz",S={},cache={};

onAuthStateChanged(auth,async u=>{
  if(!u){admin=false;tab="quiz";S={};cache={};return login()}
  U=u;const em=u.email.toLowerCase();admin=em===ADMIN_EMAIL.toLowerCase();tab="quiz";S={};cache={};
  if(!admin){try{const s=await getDoc(doc(db,"allowed",em));if(!s.exists())return denied()}catch(e){return denied()}}
  shell();
});
function login(){app.innerHTML=`<div class="card"><h1>CrimQuiz</h1><p class="mu">BS Criminology reviewer. Access is by invitation only.</p><button class="p" id="g">Sign in with Google</button><p class="err" id="m"></p></div>`;
  $("g").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("m").textContent="Sign-in failed: "+e.code)}
function denied(){app.innerHTML=`<div class="card"><h2>Not approved</h2><p>${esc(U.email)} is not on the approved list. Ask the administrator to add this Gmail address.</p><button id="o">Sign out</button></div>`;$("o").onclick=()=>signOut(auth)}
function shell(){
  app.innerHTML=`<header><h1>CrimQuiz</h1><nav id="nav"></nav></header><div id="v"></div>`;
  const t=[["quiz","Take quiz"],["prog","My progress"]];if(admin)t.push(["adm","Admin"]);t.push(["out","Sign out"]);
  $("nav").innerHTML=t.map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join("");
  $("nav").onclick=e=>{const k=e.target.dataset.t;if(!k)return;if(k=="out")return signOut(auth);tab=k;S={};draw()};draw();
}
function draw(){if(tab=="adm"&&!admin)tab="quiz";[...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t==tab));({quiz:vQuiz,prog:vProg,adm:vAdm})[tab]()}
const opts=a=>Object.keys(AREAS).map(k=>`<option>${esc(k)}</option>`).join("");
function vQuiz(){
  if(S.run)return step();
  $("v").innerHTML=`<div class="card"><h2>Start a quiz</h2><label>Area<select id="ar">${opts()}</select></label><label>Subject<select id="sb"></select></label>
  <label>Number of questions<select id="n"><option>10</option><option>20</option><option>50</option><option>100</option></select></label><button class="p" id="st">Start</button><p class="mu" id="m"></p></div>`;
  const fill=()=>$("sb").innerHTML='<option value="">All subjects in this area</option>'+AREAS[$("ar").value].map(s=>`<option value="${s[0]}">${esc(s[0]+" – "+s[1])}</option>`).join("");fill();$("ar").onchange=fill;
  $("st").onclick=async()=>{
    const a=$("ar").value,sb=$("sb").value,k=a+"|"+sb;$("m").textContent="Loading…";
    try{if(!cache[k]){const q=sb?query(collection(db,"questions"),where("area","==",a),where("subject","==",sb),limit(300)):query(collection(db,"questions"),where("area","==",a),limit(300));
      cache[k]=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}))}}catch(e){$("m").textContent="Could not load questions.";return}
    if(!cache[k].length){$("m").textContent="No questions here yet.";return}
    const p=cache[k].map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]).slice(0,+$("n").value);
    S={run:1,list:p,i:0,score:0,wrong:[],area:a,subject:sb||"All"};step();
  };
}
function step(){
  const q=S.list[S.i];if(!q)return done();S.ans=false;
  $("v").innerHTML=`<div class="card"><p class="mu">Question ${S.i+1} of ${S.list.length} · ${esc(q.subject)}</p><h2>${esc(q.q)}</h2><div id="o">${q.o.map((t,i)=>`<button class="opt" data-i="${i}">${"ABCD"[i]}. ${esc(t)}</button>`).join("")}</div><div id="r"></div></div>`;
  $("o").onclick=e=>{const b=e.target.closest(".opt");if(!b||S.ans)return;S.ans=true;const k=+b.dataset.i;
    [...$("o").children].forEach((c,i)=>{if(i==q.a)c.classList.add("ok");else if(i==k)c.classList.add("no")});
    if(k==q.a)S.score++;else S.wrong.push(q.id);
    $("r").innerHTML=`<p><b class="${k==q.a?"":"err"}">${k==q.a?"Correct!":"Incorrect."}</b> Answer: ${"ABCD"[q.a]}</p><div class="rat"><b>Rationale:</b> ${esc(q.r)}</div><p><button class="p" id="nx">${S.i+1<S.list.length?"Next":"Finish"}</button></p>`;
    $("nx").onclick=()=>{S.i++;step()}};
}
async function done(){
  const t=S.list.length,sc=S.score;
  $("v").innerHTML=`<div class="card"><h2>Quiz complete</h2><p>Score: <b>${sc}/${t}</b> (${pct(sc,t)}%)</p><p class="mu" id="sv">Saving…</p><button class="p" id="ag">Take another</button></div>`;
  $("ag").onclick=()=>{S={};vQuiz()};
  try{await addDoc(collection(db,"attempts"),{uid:U.uid,email:U.email.toLowerCase(),name:U.displayName||U.email,ts:Date.now(),area:S.area,subject:S.subject,total:t,score:sc,wrong:S.wrong});$("sv").textContent="Saved to your progress log ✓"}catch(e){$("sv").textContent="Could not save this attempt."}
}
async function vProg(){
  $("v").innerHTML='<p class="mu">Loading…</p>';
  const A=(await getDocs(query(collection(db,"attempts"),where("uid","==",U.uid)))).docs.map(d=>d.data()).sort((a,b)=>b.ts-a.ts);
  if(!A.length){$("v").innerHTML='<div class="card">No finished quizzes yet.</div>';return}
  const by={};A.forEach(a=>{by[a.area]=by[a.area]||[0,0];by[a.area][0]+=a.score;by[a.area][1]+=a.total});
  $("v").innerHTML=`<div class="card"><h2>By area</h2>${Object.entries(by).map(([k,x])=>`<p>${esc(k)} — ${pct(x[0],x[1])}% <span class="mu">(${x[0]}/${x[1]})</span></p><div class="bar"><i style="width:${pct(x[0],x[1])}%"></i></div>`).join("")}</div>
  <div class="card sc"><h2>History</h2><table><tr><th>Date</th><th>Area</th><th>Subject</th><th>Score</th></tr>${A.map(a=>`<tr><td>${new Date(a.ts).toLocaleDateString()}</td><td>${esc(a.area)}</td><td>${esc(a.subject)}</td><td>${a.score}/${a.total} (${pct(a.score,a.total)}%)</td></tr>`).join("")}</table></div>`;
}
async function vAdm(){
  if(!admin){tab="quiz";return draw()}
  $("v").innerHTML='<p class="mu">Loading…</p>';
  let al,at;try{[al,at]=await Promise.all([getDocs(collection(db,"allowed")),getDocs(collection(db,"attempts"))])}catch(e){$("v").innerHTML='<div class="card err">Access denied.</div>';return}
  const A=at.docs.map(d=>d.data());
  const rows=al.docs.map(d=>{const m=A.filter(a=>a.email==d.id),s=m.reduce((p,a)=>p+a.score,0),t=m.reduce((p,a)=>p+a.total,0);
    return `<tr><td>${esc(d.id)}</td><td>${esc(d.data().label)}</td><td>${m.length}</td><td>${t?pct(s,t)+"%":"–"}</td><td><button data-d="${esc(d.id)}">Remove</button></td></tr>`}).join("");
  $("v").innerHTML=`<div class="card"><h2>Approve a student</h2><label>Gmail address<input id="em" type="email"></label><label>Name (for your reference)<input id="ln"></label><button class="p" id="add">Add to approved list</button></div>
  <div class="card sc"><h2>Approved students (${al.size})</h2><table><tr><th>Email</th><th>Name</th><th>Quizzes</th><th>Avg</th><th></th></tr>${rows||'<tr><td colspan="5" class="mu">None yet</td></tr>'}</table></div>
  <div class="card"><h2>Import questions</h2><p class="mu">JSON array of {"area":"<full area name>","subject":"CLJ 3","q":"…","o":["A","B","C","D"],"a":0,"r":"rationale"}. "a" = index of the correct option. Subject must be a code like CLJ 3, CDI 9, CA 2.</p><textarea id="js"></textarea><button class="p" id="imp">Import</button><p class="mu" id="im"></p></div>`;
  $("add").onclick=async()=>{const e=$("em").value.trim().toLowerCase();if(!e.includes("@"))return;await setDoc(doc(db,"allowed",e),{label:$("ln").value.trim()||"(unnamed)",ts:Date.now()});vAdm()};
  $("v").onclick=async e=>{const d=e.target.dataset.d;if(d){await deleteDoc(doc(db,"allowed",d));vAdm()}};
  $("imp").onclick=async()=>{let a;try{a=JSON.parse($("js").value)}catch(e){$("im").textContent="Invalid JSON.";return}
    const ok=a.filter(x=>AREAS[x.area]&&ALLSUB[x.subject]&&x.q&&Array.isArray(x.o)&&x.o.length>=2&&x.a in x.o&&x.r);let n=0;
    for(let i=0;i<ok.length;i+=400){const b=writeBatch(db);ok.slice(i,i+400).forEach(x=>b.set(doc(collection(db,"questions")),{area:x.area,subject:x.subject,q:x.q,o:x.o,a:x.a,r:x.r}));await b.commit();n+=Math.min(400,ok.length-i);$("im").textContent=`Imported ${n}…`}
    cache={};$("im").textContent=`Imported ${n} of ${a.length}. Skipped ${a.length-n} invalid.`};
}
</script></body></html>
